name: Validate Application

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Backend, frontend, and Compose validation
    runs-on: ubuntu-latest

    env:
      COMPOSE_PROJECT_NAME: azitrax-ci
      POSTGRES_DB: azitrax
      POSTGRES_USER: azitrax
      POSTGRES_PASSWORD: azitrax
      TEST_POSTGRES_DB: azitrax_test
      TEST_POSTGRES_USER: azitrax
      TEST_POSTGRES_PASSWORD: azitrax
      REDIS_URL: redis://redis:6379/0
      VITE_CARTO_BASEMAP_API_KEY: ci-placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start production-like backend dependencies
        run: docker compose up -d --build db redis backend

      - name: Wait for backend readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs backend db redis
          exit 1

      - name: Run backend tests against the isolated test database
        run: docker compose exec -T backend pytest

      - name: Run source-to-serving Compose smoke test
        run: docker compose exec -T backend python -m scripts.production_smoke

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify generated API types are current
        working-directory: frontend
        run: npm run check:api-types

      - name: Validate clean migration history
        run: |
          set -euo pipefail
          docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "SELECT COUNT(*) FROM flyway_schema_history WHERE success = true;" \
            | grep -Eq '[[:space:]]3[[:space:]]*$'

      - name: Capture diagnostics on failure
        if: ${{ failure() }}
        run: |
          docker compose ps
          docker compose logs --no-color backend db redis

      - name: Stop Compose stack
        if: ${{ always() }}
        run: docker compose down -v --remove-orphans
